# ======================================================
#   AutomationExercise - Test Configuration
# ======================================================

# Base URL
base.url=https://automationexercise.com

# Browser Configuration (chrome | firefox | edge)
browser=chrome
headless=false

# Explicit Wait Timeout (seconds)
explicit.wait=15
page.load.timeout=30

# ==================== Test Credentials ====================
# Used for login-based tests (pre-existing stable account)
# NOTE: For register-based tests, random credentials are auto-generated
login.email=testuser_auto@example.com
login.password=Test@12345

# ==================== API Base URL ====================
api.base.url=https://automationexercise.com

# ==================== Screenshots ====================
screenshot.on.failure=true
screenshot.directory=test-output/screenshots

# ==================== Reporting ====================
allure.results.directory=target/allure-results
